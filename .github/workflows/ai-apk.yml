name: Build Avigyani AI APK

on:
  push:
    branches: [main]
    paths: ['ai/**', '.github/workflows/ai-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ai
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Create Capacitor app
        run: |
          mkdir capapp && cd capapp
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www && cp -r ../ai/* www/
          npx cap init "Avigyani AI" com.avigyani.aisahaya --web-dir www
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          cd capapp/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp $GITHUB_WORKSPACE/ai/icon-192.png $d/ic_launcher.png
            cp $GITHUB_WORKSPACE/ai/icon-192.png $d/ic_launcher_round.png
            rm -f $d/ic_launcher_foreground.png
          done
      - name: Build APK
        run: |
          cd capapp/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/avigyani-ai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: avigyani-ai-apk
          path: avigyani-ai.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-app
          name: Avigyani AI app
          body: "ಅವಿಜ್ಞಾನಿ AI ಸಹಾಯ — Android APK. Download avigyani-ai.apk and install."
          files: avigyani-ai.apk
          make_latest: true
